<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">Izmir Urban Heat Exposure</title>
  <desc id="desc">An abstract urban landscape with thermal gradient showing LCZ-based heat exposure analysis.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0c1929"/>
      <stop offset=".45" stop-color="#1a3a4a"/>
      <stop offset="1" stop-color="#2d1a15"/>
    </linearGradient>
    <linearGradient id="thermal" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#2ecc71" stop-opacity=".12"/>
      <stop offset=".35" stop-color="#f1c40f" stop-opacity=".28"/>
      <stop offset=".65" stop-color="#e67e22" stop-opacity=".35"/>
      <stop offset="1" stop-color="#e74c3c" stop-opacity=".48"/>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="10"/></filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffaa66" stroke-opacity=".06"/>
    </pattern>
  </defs>
